name: 立即抓取最新免費遊戲情報

on:
  workflow_dispatch:

jobs:
  send-latest-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip install feedparser

      - name: Send latest free game post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import feedparser
          import requests

          RSS_URL = "https://www.reddit.com/r/FreeGameFindings/new/.rss"
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"]

          feed = feedparser.parse(RSS_URL)

          def find_external_link(entry):
              reddit_link = entry.get("link", "")

              text_parts = [
                  entry.get("summary", ""),
                  entry.get("description", ""),
              ]

              for content in entry.get("content", []):
                  text_parts.append(content.get("value", ""))

              full_text = "\n".join(text_parts)
              full_text = html.unescape(full_text)

              links = re.findall(r'href="([^"]+)"', full_text)

              for link in links:
                  if "reddit.com" not in link and "redd.it" not in link:
                      return link

              return reddit_link

          entries = feed.entries[:5]

          if not entries:
              message = "【天天情報網｜即時測試】\n\n目前沒有抓到任何免費遊戲情報。"
          else:
              entry = entries[0]

              title = entry.get("title", "未知遊戲情報")
              reddit_link = entry.get("link", "")
              external_link = find_external_link(entry)

              message = f"""【天天情報網｜即時免費遊戲情報測試】

          🎮 {title}

          🔗 領取 / 商店連結：
          {external_link}

          🧾 情報來源：
          {reddit_link}

          ⚠️ 這是手動測試抓取，實際平台、免費類型與截止時間請以原文及商店頁面為準。"""

          discord_response = requests.post(
              WEBHOOK_URL,
              json={
                  "username": "天天情報員",
                  "content": message
              },
              timeout=20
          )

          print("Discord status:", discord_response.status_code)
          print(discord_response.text)

          discord_response.raise_for_status()
          print("Sent latest free game post to Discord.")
          PY
