name: 立即抓取最新免費遊戲情報

on:
  workflow_dispatch:

jobs:
  send-latest-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Send latest free game posts to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          REDDIT_URL = "https://www.reddit.com/r/FreeGameFindings/new.json?limit=5"
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"]

          headers = {
              "User-Agent": "tiantian-free-game-bot/1.0"
          }

          response = requests.get(REDDIT_URL, headers=headers, timeout=20)
          response.raise_for_status()
          data = response.json()

          posts = []

          for child in data.get("data", {}).get("children", []):
              post = child.get("data", {})

              title = post.get("title", "未知遊戲情報")
              reddit_link = "https://www.reddit.com" + post.get("permalink", "")
              external_link = (
                  post.get("url_overridden_by_dest")
                  or post.get("url")
                  or reddit_link
              )

              posts.append({
                  "title": title,
                  "external_link": external_link,
                  "reddit_link": reddit_link
              })

          if not posts:
              message = "【天天情報網｜即時測試】\n\n目前沒有抓到任何免費遊戲情報。"
          else:
              lines = ["【天天情報網｜即時免費遊戲情報測試】\n"]

              for i, post in enumerate(posts[:3], start=1):
                  lines.append(
                      f"{i}. 🎮 {post['title']}\n"
                      f"🔗 領取 / 商店連結：\n{post['external_link']}\n"
                      f"🧾 情報來源：\n{post['reddit_link']}\n"
                  )

              lines.append("⚠️ 這是手動測試抓取，實際平台、免費類型與截止時間請以原文及商店頁面為準。")
              message = "\n".join(lines)

          discord_response = requests.post(
              WEBHOOK_URL,
              json={
                  "username": "天天情報員",
                  "content": message
              },
              timeout=20
          )

          discord_response.raise_for_status()
          print("Sent latest free game posts to Discord.")
          PY
